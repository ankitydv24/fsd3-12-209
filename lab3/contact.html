<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Enquiry</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#f4f4f4;
    }

    .container{
        width:90%;
        max-width:700px;
        margin:50px auto;
        background:#fff;
        padding:30px;
        border-radius:10px;
        box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    h1{
        text-align:center;
        margin-bottom:10px;
        color:#333;
    }

    p{
        text-align:center;
        margin-bottom:25px;
        color:#666;
    }

    .form-group{
        margin-bottom:15px;
    }

    label{
        display:block;
        margin-bottom:5px;
        font-weight:bold;
    }

    input, textarea, select{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    textarea{
        resize:none;
    }

    button{
        width:100%;
        padding:12px;
        background:#007bff;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#0056b3;
    }

    .contact-info{
        margin-top:25px;
        text-align:center;
        color:#555;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Contact Us</h1>
    <p>Send us your product enquiry and we'll get back to you soon.</p>

    <form>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number">
        </div>

        <div class="form-group">
            <label>Product</label>
            <select>
                <option>Select Product</option>
                <option>Laptop</option>
                <option>Mobile Phone</option>
                <option>Headphones</option>
                <option>Smart Watch</option>
            </select>
        </div>

        <div class="form-group">
            <label>Your Enquiry</label>
            <textarea rows="5" placeholder="Write your enquiry here..."></textarea>
        </div>

        <button type="submit">Submit Enquiry</button>
    </form>

    <div class="contact-info">
        <h3>Contact Information</h3>
        <p>Email: support@example.com</p>
        <p>Phone: +91 98765 43210</p>
    </div>
</div>

</body>
</html>
